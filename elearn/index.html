<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses · LearnHub</title>
  <meta name="description" content="Course catalogue: web development, design and developer tools.">
  <meta name="theme-color" content="#0a3470">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2716%27 fill=%27%23d71920%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=JetBrains+Mono:wght@500;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,800&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <script>try{var p=JSON.parse(localStorage.getItem('learnhub.prefs'));if(p){document.documentElement.dataset.theme=p.theme;document.documentElement.style.setProperty('--fs',p.fs)}}catch(e){}</script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main" tabindex="-1">
    <header class="page-head">
      <div class="container">
        <h1>Course catalogue</h1>
        <p>Short, structured courses with lessons, quizzes and certificates of completion.</p>
        <div class="search search-wrap" role="search"><span id="search-ico"></span><input id="f-q" type="search" placeholder="Search by title, topic or instructor" aria-label="Search courses" autocomplete="off"></div>
        <ul class="facts" id="facts" aria-label="Catalogue summary"></ul>
      </div>
    </header>
    <div class="container catalog" id="catalog">
      <aside class="facets" aria-label="Filters">
        <form id="filters" onsubmit="return false">
          <div class="groups" id="groups"></div>
          <button class="btn small" type="button" id="clear-filters">Clear all filters</button>
        </form>
      </aside>
      <section aria-label="Results">
        <div class="results-head">
          <p id="result-count" aria-live="polite" style="margin:0"></p>
          <div class="row">
            <span><label for="f-sort">Sort by</label><select id="f-sort"><option value="popular">Most popular</option><option value="rating">Highest rated</option><option value="newest">Newest</option><option value="title">Title A–Z</option><option value="hours">Shortest first</option></select></span>
            <span><label for="f-size">Show</label><select id="f-size"><option>3</option><option>6</option><option>9</option></select></span>
          </div>
        </div>
        <div id="grid" class="course-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
        <nav id="pager" class="pagination" aria-label="Pagination"></nav>
      </section>
    </div>
  </main>
  <div id="site-footer"></div>
  <noscript><p class="container">This site needs JavaScript to run.</p></noscript>
  <script type="module" src="js/catalog.js"></script>
</body>
</html>
