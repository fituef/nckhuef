 <div class="card tw"><h3>Đánh giá chất lượng hoạt động</h3><table><tr><th>Hoạt động</th><th>Lượt đánh giá</th><th>Điểm TB</th></tr>${A.filter(a=>Object.keys(a.rate).length).map(a=>`<tr><td>${esc(a.title)}</td><td>${Object.keys(a.rate).length}</td><td>${stars(Math.round(avg(a)))} ${avg(a).toFixed(1)}</td></tr>`).join('')}</table></div>`}
};
function actList(){const f=st.q.toLowerCase(),l=A.filter(a=>(!st.tag||a.tag===st.tag)&&(!st.sts||a.state===st.sts)&&(!f||a.title.toLowerCase().includes(f))).sort((x,y)=>y.date.localeCompare(x.date));return l.map(a=>{const r=a.regs.includes(U.id),at=a.att.includes(U.id);return `<div class="card" style="border-top:4px solid ${TC[a.tag]}">${tgB(a.tag)} ${stB(a)}<h3 style="margin:8px 0 4px">${esc(a.title)}</h3><div class="mu">${I('cal')} ${fd(a.date)} · ${a.time}<br>${I('pin')} ${a.place}<br>${I('bld')} ${a.unit}</div><div class="bar" style="margin:8px 0 3px"><i style="width:${Math.min(100,a.regs.length/a.cap*100)}%"></i></div><div class="mu">${a.regs.length}/${a.cap} đã đăng ký</div><div style="margin-top:8px">${at?'<span class="ok">✓ Đã tham gia</span>':a.state==='plan'?(r?`<span class="ok">Đã đăng ký</span> <button class="s d" onclick="unreg(${a.id})">Hủy</button>`:`<button class="p s" ${a.regs.length>=a.cap?'disabled':''} onclick="doReg(${a.id})">${a.regs.length>=a.cap?'Đủ chỗ':'Đăng ký'}</button>`):a.state==='open'?'<button class="g s" onclick="go(\'chk\')">Điểm danh</button>':'<span class="mu">Đã kết thúc</span>'}</div></div>`}).join('')||'<div class="card mu">Không tìm thấy hoạt động.</div>'}
function actBoard(){const l=A.filter(a=>(!st.tag||a.tag===st.tag)&&(!st.q||a.title.toLowerCase().includes(st.q.toLowerCase())));
 if(st.view==='ls')return `<div class="card tw"><table><tr><th>Hoạt động</th><th>Nhóm</th><th>Đơn vị</th><th>Ngày</th><th>ĐK</th><th>Có mặt</th><th>Trạng thái</th><th></th></tr>${l.map(a=>`<tr><td>${esc(a.title)}</td><td>${tgB(a.tag)}</td><td>${a.unit}</td><td>${fd(a.date)}</td><td>${a.regs.length}/${a.cap}</td><td>${a.att.length}</td><td>${stB(a)}</td><td><button class="ab c" onclick="openAct(${a.id})">${I('eye')}</button> <button class="ab e" onclick="actForm(${a.id})">${I('edit')}</button> <button class="ab x" onclick="delAct(${a.id})">${I('trash')}</button></td></tr>`).join('')}</table></div>`;
 return `<div class="kb">${[['plan','Sắp diễn ra','#1f9bd8'],['open','Đang điểm danh','#2e9e4f'],['done','Đã kết thúc','#8792a5']].map(([k,n,c])=>{const x=l.filter(a=>a.state===k).sort((p,q)=>p.date.localeCompare(q.date));return `<div class="kc" ondragover="event.preventDefault()" ondrop="drop('${k}')"><div class="kh" style="border-top:3px solid ${c}"><span>${n} (${x.length})</span><small>${x.reduce((s,a)=>s+a.att.length,0)} lượt có mặt</small></div>${x.map(a=>`<div class="kcd" style="border-left-color:${TC[a.tag]}" draggable="true" ondragstart="dragId=${a.id}" onclick="openAct(${a.id})">${tgB(a.tag)}<b>${esc(a.title)}</b><div class="mu">${I('cal')} ${fd(a.date)} ${a.time} · ${a.place}</div><div class="bar" style="margin:6px 0 2px"><i style="width:${Math.min(100,a.regs.length/a.cap*100)}%"></i></div><div class="mu">${a.regs.length}/${a.cap} đăng ký · ${a.att.length} có mặt</div></div>`).join('')||'<p class="mu" style="padding:10px">Trống</p>'}</div>`}).join('')}</div>`}
function drop(k){const a=A.find(x=>x.id===dragId);if(a&&a.state!==k){a.state=k;toast('Đã chuyển sang: '+{plan:'Sắp diễn ra',open:'Đang điểm danh',done:'Đã kết thúc'}[k])}render()}
function openAct(id,tab){const a=A.find(x=>x.id===id);st.dt=tab||st.dt;const t=st.dt,sv=l=>l.map(i=>stu(i)).filter(Boolean);let body='';
 if(t==='info')body=`<div class="row" style="gap:20px;align-items:flex-start">${qr(a.code)}<div><div class="mu">Mã điểm danh</div><div class="code">${a.code}</div><div class="mu">QR minh họa – in/chiếu tại điểm tổ chức</div></div></div><div class="li"><div class="mu">Nhóm</div><span>${tgB(a.tag)}</span></div><div class="li"><div class="mu">Đơn vị tổ chức</div><span>${a.unit}</span></div><div class="li"><div class="mu">Thời gian</div><span>${fd(a.date)} ${a.time}</span></div><div class="li"><div class="mu">Địa điểm</div><span>${a.place}</span></div><div class="li"><div class="mu">Chỉ tiêu</div><span>${a.regs.length}/${a.cap}</span></div>`;
 else if(t==='regs')body=`<div class="row"><button onclick="csvModal('Danh sách đăng ký – ${esc(a.title)}',sv(A[${id-1}].regs))">${I('down')} Xuất danh sách</button></div><div class="tw" style="max-height:340px;overflow:auto"><table><tr><th>MSSV</th><th>Họ tên</th><th>Lớp</th><th>Có mặt</th></tr>${sv(a.regs).map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${s.cls}</td><td>${a.att.includes(s.id)?'<span class="ok">✓</span>':'–'}</td></tr>`).join('')}</table></div>`;
 else if(t==='att')body=`<div class="row"><input id="mi" list="dl2" placeholder="Thêm MSSV" style="width:150px"><datalist id="dl2">${S.map(s=>`<option value="${s.id}">`).join('')}</datalist><button class="p" onclick="manual(${id},1)">Thêm</button><button onclick="csvModal('Danh sách điểm danh – ${esc(a.title)}',sv(A[${id-1}].att))">${I('down')} Xuất danh sách</button></div><div class="tw" style="max-height:340px;overflow:auto"><table><tr><th>MSSV</th><th>Họ tên</th><th>Lớp</th><th>Giờ</th><th>Đăng ký</th></tr>${sv(a.att).map(s=>`<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${s.cls}</td><td>${(a.at[s.id]||'').slice(11)}</td><td>${a.regs.includes(s.id)?'Có':'<span class="wa">Không</span>'}</td></tr>`).join('')}</table></div>`;
 else body=`<div style="font-size:18px">${avg(a)?stars(Math.round(avg(a)))+' <b>'+avg(a).toFixed(1)+'</b> / 5 · '+Object.keys(a.rate).length+' lượt':'Chưa có đánh giá'}</div>`;
 modal(`<div class="hd"><b style="font-size:17px">${esc(a.title)}</b>${stB(a)}<span class="sp"></span><button class="ab e" onclick="actForm(${id})">${I('edit')}</button><button class="ab x" onclick="delAct(${id})">${I('trash')}</button><button class="s" onclick="closeM()">✕</button></div><div class="row" style="margin-bottom:8px">${a.state!=='open'?`<button class="g s" onclick="setSt(${id},'open')">Mở điểm danh</button>`:`<button class="d s" onclick="setSt(${id},'done')">Kết thúc</button>`}</div><div class="tabs">${[['info','Thông tin'],['regs','Đăng ký ('+a.regs.length+')'],['att','Điểm danh ('+a.att.length+')'],['rate','Đánh giá']].map(x=>`<button class="${t===x[0]?'on':''}" onclick="openAct(${id},'${x[0]}')">${x[1]}</button>`).join('')}</div>${body}`)}
const setSt=(id,s)=>{A.find(a=>a.id===id).state=s;render();openAct(id)};
function actForm(id){const a=id?A.find(x=>x.id===id):{title:'',tag:TAGS[0],unit:UNITS[0],date:'2026-12-01',time:'08:00',place:'',cap:100};modal(`<h3>${id?'Sửa':'Tạo'} hoạt động</h3><label>Tên hoạt động</label><input id="x1" value="${esc(a.title)}"><div class="row"><div><label>Nhóm (tag)</label><br><select id="x2">${TAGS.map(t=>`<option ${a.tag===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Đơn vị tổ chức</label><br><select id="x3">${UNITS.map(t=>`<option ${a.unit===t?'selected':''}>${t}</option>`).join('')}</select></div></div><div class="row"><div><label>Ngày</label><br><input id="x4" type="date" value="${a.date}"></div><div><label>Giờ</label><br><input id="x7" type="time" value="${a.time}"></div><div><label>Chỉ tiêu</label><br><input id="x5" type="number" value="${a.cap}"></div></div><label>Địa điểm</label><input id="x6" value="${esc(a.place)}"><div class="row"><button class="p" onclick="saveAct(${id||0})">Lưu</button><button onclick="closeM()">Hủy</button></div>`,'sm')}
function saveAct(id){const t=$('#x1').value.trim();if(!t)return toast('Nhập tên hoạt động');const d={title:t,tag:$('#x2').value,unit:$('#x3').value,date:$('#x4').value,time:$('#x7').value||'08:00',place:$('#x6').value||'Chưa xác định',cap:+$('#x5').value||100};if(id)Object.assign(A.find(a=>a.id===id),d);else A.push({id:A.length+1,...d,code:mkCode(),state:'plan',regs:[],att:[],at:{},rate:{}});closeM();toast('Đã lưu hoạt động');render()}
function delAct(id){if(!confirm('Xóa hoạt động này?'))return;const i=A.findIndex(a=>a.id===id);A.splice(i,1);A.forEach((a,k)=>a.id=k+1);closeM();toast('Đã xóa');render()}
function filtStd(){const p=x=>(x||'').toLowerCase();return S.filter(s=>p(s.id).includes(p(F.id))&&p(s.name).includes(p(F.name))&&p(s.cls).includes(p(F.cls))&&(!F.unit||s.unit===F.unit)&&(F.prof===''||(F.prof==='1')===(!s.first)))}
function gridBody(){const l=filtStd(),pp=F.p||0;return l.slice(pp*10,pp*10+10).map(s=>`<tr class="cl ${st.sel===s.id?'sel':''}" onclick="st.sel='${s.id}';stdSel()"><td>${s.id}</td><td>${esc(s.name)}</td><td>${s.cls}</td><td>${s.unit}</td><td>${s.phone||'–'}</td><td>${mine(s.id).length}</td><td>${s.first?'<span class="bdg b-wa">Chưa kích hoạt</span>':'<span class="bdg b-ok">Đã đủ</span>'}</td></tr>`).join('')||'<tr><td colspan=7 class="mu">Không có kết quả.</td></tr>'}
function pager(){const n=filtStd().length,pp=F.p||0,mx=Math.max(1,Math.ceil(n/10));return `<span class="mu">Tổng số: <b>${n}</b> bản ghi</span><span class="sp" style="flex:1"></span><button class="s" ${pp<=0?'disabled':''} onclick="F.p=${pp-1};gb()">‹ Trước</button><span>Trang ${pp+1}/${mx}</span><button class="s" ${pp>=mx-1?'disabled':''} onclick="F.p=${pp+1};gb()">Sau ›</button>`}
function gb(){$('#gb').innerHTML=gridBody();$('#pgr').innerHTML=pager()}
function stdSel(){gb();$('#sd').innerHTML=stdPanel();$('#sd').scrollIntoView({behavior:'smooth',block:'nearest'})}
function stdPanel(){const s=st.sel&&stu(st.sel);if(!s)return '<div class="card mu">Chọn một sinh viên trong danh sách để xem chi tiết.</div>';const m=mine(s.id);
 return `<div class="card"><div class="cols" style="grid-template-columns:300px 1fr"><div><div class="row" style="margin-bottom:10px"><i class="av" style="width:64px;height:64px;font-size:26px;background:hsl(${s.name.length*37%360} 50% 42%)">${s.name.split(' ').pop()[0]}</i><div><b style="font-size:16px">${esc(s.name)}</b><div class="mu">${s.id}</div></div></div>${[['Lớp',s.cls],['Đơn vị',s.unit],['SĐT',s.phone||'–'],['CCCD',s.cccd||'–'],['Địa chỉ',s.addr||'–'],['Số hoạt động',m.length],['Danh hiệu',T.filter(t=>t.granted.includes(s.id)).length]].map(x=>`<div class="li"><div class="mu">${x[0]}</div><span>${esc(x[1])}</span></div>`).join('')}<div class="row" style="margin-top:10px"><button class="s" onclick="stu('${s.id}').pw=s.id;stu('${s.id}').first=true;toast('Đã đặt lại mật khẩu về MSSV');render()">Đặt lại mật khẩu</button></div></div>
 <div><div class="tabs"><button class="on">Hoạt động tham gia (${m.length})</button></div>${tl(s.id,false)}<div class="row">${T.map(t=>`<span class="bdg ${t.granted.includes(s.id)?'b-ok':earned(s.id,t)?'b-wa':'b-end'}">${t.name}${t.granted.includes(s.id)?' ✓':''}</span>`).join('')}</div></div></div></div>`}
function importM(){modal(`<h3>Nhập danh sách sinh viên</h3><p class="mu">Mỗi dòng: <b>MSSV, Họ tên, Lớp</b> (dán từ Excel/CSV). Tài khoản được tạo với mật khẩu ban đầu = MSSV.</p><textarea id="imp" rows="7">SV2701,Lê Hoàng Nam,HC26A\nSV2702,Phạm Thị Thu Hà,CT26A\nSV2703,Trần Quốc Bảo,QL26A</textarea><div class="row"><button class="p" onclick="doImport()">Tạo tài khoản</button><button onclick="closeM()">Hủy</button></div>`,'sm')}
function doImport(){let n=0;$('#imp').value.split('\n').forEach(l=>{const [id,name,cls]=l.split(/[,;\t]/).map(x=>x.trim());if(!id||!name||S.some(s=>s.id===id))return;const u={HC:2,CT:3,QL:4}[(cls||'').slice(0,2).toUpperCase()]||0;S.push({id,name,cls:cls||'',unit:UNITS[u],pw:id,first:true,phone:'',addr:'',cccd:'',act:.5});n++});closeM();toast(`Đã tạo ${n} tài khoản`);render()}
function doReg(id){const a=A[id-1];if(!a.regs.includes(U.id))a.regs.push(U.id);toast('Đăng ký thành công');render()}
function unreg(id){const a=A[id-1];a.regs=a.regs.filter(x=>x!==U.id);toast('Đã hủy đăng ký');render()}
function check(id){const a=A[id-1],c=$('#c'+id).value.trim().toUpperCase();if(c!==a.code)return toast('Mã không đúng');addAtt(a,U.id,TODAY+' '+new Date().toTimeString().slice(0,5));toast('Điểm danh thành công ✓');render()}
function rate(id,n){A[id-1].rate[U.id]=n;render()}
function sendFb(){const x=$('#fx').value.trim();if(!x)return toast('Vui lòng nhập nội dung');FB.unshift({id:FB.length+1,who:U.id,type:$('#ft').value,txt:x,status:'Mới',t:TODAY,reply:''});toast('Đã gửi');render()}
function manual(id,d){const a=A[id-1],v=$('#mi').value.trim().toUpperCase(),s=stu(v);if(!s)return toast('Không tìm thấy MSSV');if(a.att.includes(v))return toast('Đã điểm danh trước đó');addAtt(a,v,a.date+' '+new Date().toTimeString().slice(0,5));toast('Đã thêm '+s.name);render();if(d)openAct(id,'att')}
function simScan(id){const a=A[id-1],c=S.filter(s=>!a.att.includes(s.id));if(!c.length)return;const s=pick(c);addAtt(a,s.id,a.date+' '+new Date().toTimeString().slice(0,5));toast(s.name+' vừa điểm danh');render()}
function grant(t,id){T[t-1].granted.push(id);toast('Đã công nhận');render()}
function rule(t,i,d){const r=T[t-1].rules;if(d===0)r.splice(i,1);else r[i].n=Math.max(1,r[i].n+d);render()}
function addRule(t,tag){if(tag)T[t-1].rules.push({tag,n:1});render()}
function postN(){const a=$('#nt1').value.trim();if(!a)return toast('Nhập tiêu đề');NT.unshift({id:NT.length+1,t:TODAY,title:a,body:$('#nt2').value,aud:$('#nt3').value,pin:$('#nt4').checked});toast('Đã đăng thông báo');render()}
function reply(id){const f=FB.find(x=>x.id===id);f.reply=$('#rp'+id).value.trim()||'Đã tiếp nhận.';f.status='Đã phản hồi';toast('Đã gửi phản hồi');render()}
render();
</script></body></html>
