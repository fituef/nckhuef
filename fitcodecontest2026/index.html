<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FIT CODE CONTEST – Tra cứu đề thi</title>
<link rel="icon" type="image/png" href="assets/apple-touch-icon.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="theme-color" content="#061a3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#061a3a;          /* xanh navy nền */
    --panel:#0a2552;       /* nền cửa sổ terminal */
    --bar:#0d2f68;         /* thanh tiêu đề */
    --line:#1d4488;        /* viền */
    --blue:#0850a0;        /* xanh UEF */
    --blue-lit:#5aa2ff;    /* xanh sáng cho chữ trên nền tối */
    --red:#e81820;         /* đỏ UEF */
    --ok:#6ee7a3;
    --text:#eaf1ff;
    --muted:#93a9d0;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
  }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  body {
    margin:0; min-height:100vh; padding:28px 18px 36px;
    display:flex; flex-direction:column; align-items:center; gap:28px;
    background-color:var(--bg);
    background-image:
      linear-gradient(rgba(90,162,255,.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(90,162,255,.07) 1px, transparent 1px);
    background-size:32px 32px;
    color:var(--text); font-family:var(--mono); line-height:1.55;
  }
  header { width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; gap:22px; text-align:center; }
  .plate {  border-radius:10px; padding:8px 14px; border-bottom:3px solid var(--red); }
  .plate img { display:block; height:84px; width:auto; max-width:100%; }
  h1 {
    margin:0; font-size:clamp(1.7rem, 7vw, 3rem); font-weight:800; letter-spacing:.02em; line-height:1.1;
  }
  h1 .caret { display:inline-block; width:.5em; height:.9em; margin-left:.12em; vertical-align:-.08em;
    background:var(--red); animation:blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  .tag { margin:0; color:var(--muted); font-size:.95rem; }
  .tag b { color:var(--blue-lit); font-weight:500; }

  .term { width:100%; max-width:640px; background:var(--panel); border:1px solid var(--line);
    border-radius:12px; overflow:hidden; box-shadow:0 18px 50px rgba(0,0,0,.45); }
  .bar { display:flex; align-items:center; gap:8px; padding:10px 14px; background:var(--bar); border-bottom:1px solid var(--line); }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--line); }
  .dot.r { background:var(--red); } .dot.b { background:var(--blue-lit); } .dot.w { background:#fff; }
  .bar span.name { margin-left:8px; font-size:.82rem; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .body { padding:22px 20px 24px; }
  .row { display:flex; align-items:center; gap:10px; }
  .ps { color:var(--red); font-weight:700; white-space:nowrap; }
  .cmd { color:var(--blue-lit); white-space:nowrap; }
  label { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
  input {
    flex:1; min-width:0; padding:11px 12px; font:inherit; font-size:1.05rem; color:var(--text);
    background:var(--bg); border:1px solid var(--line); border-radius:8px; caret-color:var(--red);
  }
  input::placeholder { color:#5b74a3; }
  input:focus-visible, button:focus-visible, a.dl:focus-visible { outline:2px solid var(--blue-lit); outline-offset:2px; }
  button, a.dl {
    font:inherit; font-weight:700; cursor:pointer; border:0; border-radius:8px; text-decoration:none;
    background:var(--red); color:#fff; padding:12px 18px; display:inline-block;
  }
  button { width:100%; margin-top:14px; font-size:1rem; }
  button:hover, a.dl:hover { background:#ff2e36; }
  button:disabled { opacity:.55; cursor:default; }

  .out { margin-top:18px; font-size:.95rem; display:none; border-left:3px solid var(--line); padding:4px 0 4px 14px; }
  .out.ok  { display:block; border-color:var(--ok); }
  .out.err { display:block; border-color:var(--red); }
  .out .s-ok { color:var(--ok); font-weight:700; }
  .out .s-err { color:#ff6b72; font-weight:700; }
  .out b { color:#fff; }
  .out a.dl { margin-top:12px; }

  footer { width:100%; max-width:640px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; }
  footer img { display:block; width:100%; max-width:380px; height:auto; border-radius:14px; }
  footer p { margin:0; font-size:.8rem; color:var(--muted); }

  @media (max-width:480px) {
    .row { flex-wrap:wrap; } .cmd { display:none; }
    .plate img { height:68px; }
  }
  @media (prefers-reduced-motion: reduce) { h1 .caret { animation:none; } }
</style>
</head>
<body>
<header>
  <div class="plate"><img src="assets/logo-uef.png" alt="FIT UEF – Faculty of Information Technology"></div>
  <h1>FIT CODE CONTEST 2026<span class="caret" aria-hidden="true"></span></h1>
  <p class="tag">Tra cứu và tải đề thi bằng <b>MSSV</b> của bạn</p>
</header>

<main class="term">
  <div class="bar" aria-hidden="true">
    <i class="dot r"></i><i class="dot w"></i><i class="dot b"></i>
    <span class="name">fit-code-contest ~ tra-cuu-de-thi</span>
  </div>
  <div class="body">
    <div class="row">
      <span class="ps">$</span><span class="cmd">tra-cuu --mssv</span>
      <label for="user">MSSV (USER)</label>
      <input id="user" type="text" inputmode="numeric" autocomplete="off" placeholder="Nhập MSSV" autofocus>
    </div>
    <button id="go" type="button">Tra cứu</button>
    <div id="msg" class="out" role="status" aria-live="polite"></div>
  </div>
</main>

<footer>
   
  <p>Khoa Công nghệ Thông tin – Đại học Kinh tế Tài chính TP.HCM</p>
</footer>

<script>
(async function () {
  const $ = id => document.getElementById(id);
  const input = $("user"), btn = $("go"), msg = $("msg");
  let data = null;

  const show = (kind, html) => { msg.className = "out " + kind; msg.innerHTML = html; };
  const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
  async function sha256(text) {
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
  }

  async function load() {
    try {
      const res = await fetch("data.json", { cache: "no-cache" });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
    } catch (e) { data = null; }
    return data;
  }
  await load();

  async function lookup() {
    const user = input.value.replace(/\s+/g, "");
    if (!user) { show("err", '<span class="s-err">[lỗi]</span> Vui lòng nhập MSSV.'); return; }
    if (!data && !(await load())) { show("err", '<span class="s-err">[lỗi]</span> Chưa kết nối được dữ liệu. Vui lòng thử lại.'); return; }
    if (!window.crypto || !crypto.subtle) { show("err", '<span class="s-err">[lỗi]</span> Vui lòng mở trang qua HTTPS để tra cứu.'); return; }
    const path = data.items[await sha256(data.salt + ":" + user)];
    if (!path) {
      show("err", '<span class="s-err">[không thấy]</span> Không tìm thấy MSSV <b>' + esc(user) + "</b>. Vui lòng kiểm tra lại hoặc liên hệ giám thị.");
      return;
    }
    const href = path.split("/").map(encodeURIComponent).join("/");
    show("ok", '<span class="s-ok">[ok]</span> Đã tìm thấy đề thi cho MSSV <b>' + esc(user) + "</b>.<br>" +
      '<a class="dl" href="' + href + '" download="De-thi-' + esc(user) + '.pdf">Tải đề thi (PDF)</a>');
  }

  btn.addEventListener("click", lookup);
  input.addEventListener("keydown", e => { if (e.key === "Enter") lookup(); });
})();
</script>
</body>
</html>
