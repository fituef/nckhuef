<script>
function evaluateEntry(f, cfg) {
  var INF = Infinity, LABEL = ['AN TOÀN', 'CHÚ Ý', 'NGUY HIỂM'];
  function num(s) { if (s == null || String(s).trim() === '') return null; return /^\s*-?\d+([.,]\d+)?\s*$/.test(String(s)) ? parseFloat(String(s).replace(',', '.')) : NaN; }
  function band(v, r) {
    var a = r[0] == null ? -INF : r[0], b = r[1] == null ? -INF : r[1], c = r[2] == null ? INF : r[2], d = r[3] == null ? INF : r[3];
    return (v < a || v > d) ? 2 : (v < b || v > c) ? 1 : 0;
  }
  var cr = [];
  cfg.specs.forEach(function (sp) {
    var st = -1, shown = [];
    sp.f.forEach(function (k) { var v = num(f[k]); if (v == null || isNaN(v)) return; shown.push(f[k]); st = Math.max(st, band(v, sp.r)); });
    if (st < 0) return;
    cr.push({label: sp.label, value: shown.join(' / '), st: st, tip: [sp.ok, sp.w, sp.d][st]});
  });
  [['mauNuoc', 'Màu nước'], ['ganTuy', 'Gan tụy'], ['ruot', 'Ruột tôm']].forEach(function (p) {
    var o = (cfg.color[p[0]] || []).filter(function (x) { return x[0] === f[p[0]]; })[0];
    if (!o) return;
    cr.push({label: p[1], value: o[0], st: o[1], tip: ['Tiếp tục theo dõi', 'Giảm ăn, bổ sung vitamin, theo dõi 4 giờ', 'Ngừng ăn, kiểm tra kỹ, liên hệ kỹ thuật'][o[1]]});
  });
  var all = cr.reduce(function (m, c) { return Math.max(m, c.st); }, 0);
  var names = function (s) { return cr.filter(function (c) { return c.st === s; }).map(function (c) { return c.label; }).join(', '); };
  var why = !cr.length ? 'Chưa nhập chỉ số nào.' : all == 2 ? 'Có ' + cr.filter(function (c) { return c.st == 2; }).length + ' chỉ số nguy hiểm: ' + names(2) + '. Nguy cơ tôm sốc, bệnh, hao hụt cao.' : all == 1 ? 'Có ' + cr.filter(function (c) { return c.st == 1; }).length + ' chỉ số cần chú ý: ' + names(1) + '. Xử lý sớm để tránh chuyển nguy hiểm.' : 'Mọi chỉ số đã nhập đều trong ngưỡng tối ưu.';
  var act = all == 2 ? 'Làm ngay: tăng tối đa oxy, dừng hoặc cắt giảm thức ăn, xi phông đáy, thay 20–30% nước sạch đã xử lý, đo lại sau 2 giờ, báo kỹ thuật.' : all == 1 ? 'Tăng quạt, giảm 10–20% thức ăn, xi phông nhẹ, bổ sung vi sinh hoặc vitamin, đo lại sau 4 giờ.' : 'Giữ chế độ chăm sóc hiện tại, cho ăn đúng cữ, chạy quạt đều.';
  return {all: all, empty: !cr.length, why: why, act: act, cr: cr};
}

}
async function doLogin(){
 if(S.busy)return;S.busy=true;S.msg="";draw();
 try{var r=await rpc("api_login",S.login.u,S.login.p);S.tok=r.token;ls("sat4_tok",S.tok);S.login={u:"",p:""};await load()}
 catch(e){S.busy=false;S.msg=emsg(e);S.login.p="";draw()}
}
async function doSave(){
 if(S.busy||!S.user||S.user.ro||Object.keys(errors()).length)return;

var ROWS=[["Nước",[["phSang","pH sáng",""],["phChieu","pH chiều",""],["doSang","DO sáng","mg/L"],["doChieu","DO chiều","mg/L"],["nhietDo","Nhiệt độ","°C"],["doMan","Độ mặn","‰"],["kH","kH","mg/L"]]],["Khí độc đáy ao",[["nh3","NH3","mg/L"],["no2","NO2","mg/L"],["h2s","H2S","mg/L"]]],["Tôm và cho ăn",[["thucAn","Thức ăn","kg"],["tlTom","Tôm nặng","g"],["mauNuoc","Màu nước",""],["ganTuy","Gan tụy",""],["ruot","Ruột tôm",""]]]];
function fullHtml(e){
 var f=normF(e.f),h='<div class="card" style="box-shadow:none;border:1px solid var(--bd);margin-top:12px"><div class="sec" style="font-size:18px;margin-bottom:2px">Chi tiết từng chỉ số</div>';
 ROWS.forEach(function(g){
  h+='<div class="gh">'+g[0]+'</div>';
  g[1].forEach(function(r){
   var k=r[0],v=f[k],st=null,tip="",tg="",sp=specOf(k),empty=v==null||String(v).trim()==="";

  });
 });
 return h+'</div>';
}
function viewLich(){
 var fm=S.user.kind==="farmer",list=S.logs.filter(function(e){return S.filter==="all"||e.f.ao===S.filter});
 var h=(fm?'<div class="sub">Các bản ghi do bạn nhập, mới nhất ở trên. Bấm vào một bản ghi để xem đầy đủ.</div>':"")+'<div class="chips"><button class="pill" data-a="fpond" data-id="all" aria-pressed="'+(S.filter==="all")+'">Tất cả</button>'+S.user.ponds.map(function(p){return '<button class="pill" data-a="fpond" data-id="'+esc(p)+'" aria-pressed="'+(S.filter===p)+'">'+esc(p)+'</button>'}).join("")+'</div>';
 if(S.bad&&!fm)h+='<div class="sub">'+S.bad+' dòng sai định dạng trong Sheet bị bỏ qua.</div>';

}

function modalHtml(){

 var ev=evOf(e),fm=S.user.kind==="farmer",pond=S.ponds.filter(function(p){return p.id===e.f.ao})[0];

}
function viewTk(){
 var u=S.user;
 return '<div class="card"><div class="row" style="align-items:center;justify-content:flex-start;gap:14px"><div class="avatar">'+esc(u.name.charAt(0).toUpperCase())+'</div><div><div class="t1">'+esc(u.name)+'</div><div class="sub">'+esc(u.role)+(u.ro?" (chỉ xem)":"")+'</div></div></div><div class="sub" style="margin-top:12px">Ao được xem: '+esc(u.ponds.join(", ")||"chưa có")+'</div></div><div class="card"><div class="sec">🔒 Đổi mật khẩu</div><div class="fields"><div><label for="po">Mật khẩu hiện tại</label><input type="password" id="po" data-c="o" value="'+esc(S.pw.o)+'" autocomplete="current-password"></div><div><label for="pn">Mật khẩu mới (ít nhất 6 ký tự)</label><input type="password" id="pn" data-c="n" value="'+esc(S.pw.n)+'" autocomplete="new-password"></div><div><label for="pn2">Nhập lại mật khẩu mới</label><input type="password" id="pn2" data-c="n2" value="'+esc(S.pw.n2)+'" autocomplete="new-password"></div><button class="btn" data-a="pw"'+(S.busy?" disabled":"")+'>Đổi mật khẩu</button></div></div><button class="btn alt" data-a="logout">Đăng xuất</button>';
}
var ROLES=[["Nguoi nuoi","Người nuôi"],["Ky thuat","Kỹ thuật (chỉ xem)"],["Chu ao","Chủ ao"]];
function roleLabel(r){var x=ROLES.filter(function(y){return noA(y[0])===noA(r)})[0];return x?x[1]:r}
function tabsFor(){var k=S.user&&S.user.kind;return k==="owner"?[["canh","Tổng quan"],["nhap","Nhập liệu"],["lich","Lịch sử"],["ql","Quản lý"],["tk","Tài khoản"]]:k==="tech"?[["canh","Tổng quan"],["lich","Lịch sử"],["tk","Tài khoản"]]:[["nhap","Nhập liệu"],["lich","Lịch sử"],["tk","Tài khoản"]]}
async function loadUsers(){try{S.users=await rpc("api_users",S.tok);draw()}catch(e){fail(e)}}
function editOf(u){var all=S.ponds.map(function(p){return p.id}),g=noA(u.pondsTxt),r=ROLES.filter(function(y){return noA(y[0])===noA(u.role)})[0];return{id:u.id,name:u.full||u.name,phone:u.phone||"",uname:u.uname,role:r?r[0]:"Nguoi nuoi",ponds:g.indexOf("tat ca")>-1?all:String(u.pondsTxt).split(",").map(function(x){return x.trim()}).filter(Boolean),password:""}}
async function saveUser(){if(S.busy)return;S.busy=true;draw();try{await rpc("api_saveUser",S.tok,S.edit);S.edit=null;S.busy=false;await loadUsers();toast("Đã lưu người dùng")}catch(e){fail(e)}}
async function setPond(id,on){S.busy=true;draw();try{await rpc("api_setPond",S.tok,id,on);await load();toast("Đã cập nhật ao")}catch(e){fail(e)}}
function viewQl(){
 var h="";
 if(S.edit){var e=S.edit,isNew=!e.id;
  return '<div class="card"><div class="sec">'+(isNew?"Thêm người dùng":"Sửa người dùng")+'</div><div class="fields"><div><label for="e1">Họ tên</label><input type="text" id="e1" data-e="name" value="'+esc(e.name)+'"></div><div><label for="e2">Số điện thoại</label><input type="text" inputmode="tel" id="e2" data-e="phone" value="'+esc(e.phone)+'"></div><div><label for="e3">Tên đăng nhập</label><input type="text" id="e3" data-e="uname" value="'+esc(e.uname)+'" autocapitalize="none" spellcheck="false"'+(isNew?"":" disabled")+'></div><div><label for="e4">Vai trò</label><select id="e4" data-e="role" style="font-size:16px">'+ROLES.map(function(r){return '<option value="'+r[0]+'"'+(e.role===r[0]?" selected":"")+'>'+r[1]+'</option>'}).join("")+'</select></div>'+(e.role==="Chu ao"?'<div class="hint">Chủ ao thấy và quản lý tất cả các ao.</div>':'<div><label>Ao phụ trách</label><div class="chips">'+S.ponds.map(function(p){return '<button type="button" class="pill" data-a="upond" data-id="'+esc(p.id)+'" aria-pressed="'+(e.ponds.indexOf(p.id)>-1)+'">'+esc(p.id)+'</button>'}).join("")+'</div></div>')+'<div><label for="e5">'+(isNew?"Mật khẩu tạm (ít nhất 6 ký tự)":"Mật khẩu mới (bỏ trống nếu không đổi)")+'</label><input type="text" id="e5" data-e="password" value="'+esc(e.password)+'" autocomplete="off"></div><button class="btn" data-a="usave"'+(S.busy?" disabled":"")+'>Lưu</button><button class="btn alt" data-a="ucancel">Hủy</button></div></div>';}
 h+='<button class="btn" data-a="unew">'+ico(IC.plus,24)+' Thêm người dùng</button>';
 if(!S.users)h+='<div class="empty">Đang tải danh sách…</div>';
 (S.users||[]).forEach(function(u){h+='<div class="card"><div class="row"><div><div class="t1">'+esc(u.name)+'</div><div class="sub">@'+esc(u.uname)+' · '+esc(roleLabel(u.role))+'</div></div><button class="btn alt sm" data-a="uedit" data-id="'+esc(u.id)+'">Sửa</button></div><div class="hint" style="margin-top:8px">Ao: '+esc(u.pondsTxt||"chưa có")+'</div></div>'});
 h+='<div class="card"><div class="sec">Các ao</div>'+S.ponds.map(function(p){return '<div class="row" style="align-items:center;padding:10px 0;border-top:1px solid var(--bd)"><div><b>'+esc(p.id)+'</b> <span class="sub">'+esc(p.name)+'</span><div class="sub">'+(p.on?"Đang nuôi":"Ao lắng, không nhập")+'</div></div><button class="btn alt sm" data-a="pondon" data-id="'+esc(p.id)+'" data-on="'+(p.on?0:1)+'">'+(p.on?"Chuyển ao lắng":"Bật nuôi")+'</button></div>'}).join("")+'</div>';
 return h;
}
function draw(){
 var keep=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart,sy=window.scrollY,app=document.getElementById("app");
 if(!S.tok||!S.user){app.innerHTML=(S.tok&&S.busy)?'<div class="login"><div class="logo">🦐</div><h1>Sổ ao tôm</h1><div class="sub" style="font-size:16px">Đang tải dữ liệu…</div></div>':viewLogin();restore(keep,pos,sy);return}
 var tabs=tabsFor();
 var body=S.tab==="nhap"?viewNhap():S.tab==="lich"?viewLich():S.tab==="tk"?viewTk():S.tab==="ql"?viewQl():viewCanh();
 var dk=S.tab==="nhap"&&!S.last&&!S.user.ro&&inputPonds().length;
 app.innerHTML='<div class="top"><div class="brand"><div class="logo">🦐</div>Sổ ao tôm</div><button class="iconbtn" data-a="reload" aria-label="Tải lại dữ liệu"'+(S.busy?" disabled":"")+'>'+ico(IC.sync,24)+'</button></div><main'+(dk?' class="dk"':"")+'>'+body+'</main><nav>'+tabs.map(function(t){return '<button data-tab="'+t[0]+'"'+(S.tab===t[0]?' aria-current="page"':"")+'>'+ico(IC[t[0]],26)+t[1]+'</button>'}).join("")+'</nav>'+(S.toast?'<div class="toast" role="status">'+esc(S.toast)+'</div>':"")+modalHtml();document.body.style.overflow=S.modal?"hidden":"";
 restore(keep,pos,sy);
}
function restore(keep,pos,sy){var ap=document.querySelector&&document.querySelector(".hs .pill[aria-pressed=true]");if(ap&&ap.scrollIntoView)ap.scrollIntoView({inline:"center",block:"nearest"});
 if(keep){var el=document.getElementById(keep);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
 if(S.focusModal){var c=document.querySelector(".mclose");if(c)c.focus();S.focusModal=false}
 if(S.focusOpener){var o=document.querySelector('[data-a="open"][data-id="'+S.focusOpener+'"]');if(o)o.focus({preventScroll:true});S.focusOpener=null}
 window.scrollTo(0,sy)}
document.addEventListener("input",function(ev){
 var d=ev.target.dataset||{};
 if(d.l){S.login[d.l]=ev.target.value;return}
 if(d.c){S.pw[d.c]=ev.target.value;return}
 if(d.e){S.edit[d.e]=ev.target.value;return}
 if(!d.k||d.k==="filter")return;
 S.form[d.k]=ev.target.type==="checkbox"?ev.target.checked:ev.target.value;S.reqId=null;draw();
});
document.addEventListener("change",function(ev){var d=ev.target.dataset||{};if(d.k==="filter"){S.filter=ev.target.value;draw()}if(d.e==="role"){S.edit.role=ev.target.value;draw()}});
document.addEventListener("keydown",function(ev){
 if(ev.key==="Enter"&&ev.target.dataset&&ev.target.dataset.l)doLogin();
 if(S.modal&&ev.key==="Escape"){closeModal();return}
 if(S.modal&&ev.key==="Tab"){var f=[].slice.call(document.querySelectorAll(".sheet button")),a=document.activeElement;if(!f.length)return;if(!ev.shiftKey&&(a===f[f.length-1]||f.indexOf(a)<0)){ev.preventDefault();f[0].focus()}else if(ev.shiftKey&&(a===f[0]||f.indexOf(a)<0)){ev.preventDefault();f[f.length-1].focus()}}
});
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-tab],[data-a]");if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;S.edit=null;draw();window.scrollTo(0,0);if(S.tab==="ql")loadUsers();return}
 var a=t.dataset.a;if(a==="close"&&t.classList.contains("ov")&&ev.target!==t)return;
 if(a==="login")doLogin();else if(a==="save")doSave();else if(a==="pw")doPw();else if(a==="logout")doLogout();
 else if(a==="reload")load();
 else if(a==="again"){S.form=blank(inputPonds()[0]);S.last=null;draw()}
 else if(a==="showpw"){S.showPw=!S.showPw;draw()}
 else if(a==="go"){S.tab=t.dataset.go;draw();window.scrollTo(0,0)}
 else if(a==="fpond"){S.filter=t.dataset.id;draw()}
 else if(a==="unew"){S.edit={id:"",name:"",phone:"",uname:"",role:"Nguoi nuoi",ponds:[],password:""};draw();window.scrollTo(0,0)}
 else if(a==="uedit"){var u=(S.users||[]).filter(function(x){return x.id===t.dataset.id})[0];if(u){S.edit=editOf(u);draw();window.scrollTo(0,0)}}
 else if(a==="ucancel"){S.edit=null;draw()}
 else if(a==="usave")saveUser();
 else if(a==="upond"){var i=S.edit.ponds.indexOf(t.dataset.id);if(i>-1)S.edit.ponds.splice(i,1);else S.edit.ponds.push(t.dataset.id);draw()}
 else if(a==="pondon")setPond(t.dataset.id,t.dataset.on==="1")
 else if(a==="range"){S.range=+t.dataset.n;draw()}
 else if(a==="ind"){S.ind=t.dataset.k;draw()}
 else if(a==="gohist"){S.modal=null;S.filter=t.dataset.id;S.tab="lich";draw();window.scrollTo(0,0)}
 else if(a==="open"){S.modal=t.dataset.id;S.opener=t.dataset.id;S.focusModal=true;draw()}
 else if(a==="close"){closeModal()}
 else if(a==="pond"){S.modal=null;S.form.ao=t.dataset.id;S.reqId=null;S.last=null;S.tab="nhap";draw();window.scrollTo(0,0)}
});
if(API_URL.indexOf("https://script.google.com/")!==0){document.getElementById("app").innerHTML='<div class="login"><h1>Sổ ao tôm</h1><div class="res s1"><b>Chưa cấu hình máy chủ.</b><div style="margin-top:6px;font-size:14px">Mở file index.html, tìm dòng API_URL và dán link triển khai Apps Script (đuôi /exec).</div></div></div>'}
else if(S.tok){load()}else{draw()}
</script>
