<html lang="vi">
<head>

<style>
@import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700;800&display=swap");
:root{--bg:#f3efe6;--sf:#fff;--sf2:#eee9dd;--tx:#1b2926;--mu:#4a5955;--bd:#d6d0c0;--pri:#0b5d4b;--prt:#fff;--pri2:#d6ece5;--ok:#14663a;--okb:#e0f2e6;--wn:#7d5200;--wnb:#ffefc2;--dg:#a8231b;--dgb:#fde4e1;--sh:0 1px 2px rgba(20,30,25,.08),0 8px 22px rgba(20,30,25,.08)}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 18px/1.5 "Be Vietnam Pro",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button,input,select,textarea{font-family:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:21px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--pri);color:var(--prt);display:grid;place-items:center;font-size:23px}
.iconbtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);display:grid;place-items:center;cursor:pointer;color:var(--tx)}

.hero h2{margin:0;font-size:25px;line-height:1.25}.hero p{margin:4px 0 0;font-size:16px;opacity:.95}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.17);border-radius:14px;padding:8px 6px;text-align:center}.stat b{display:block;font-size:28px;line-height:1.1}.stat span{font-size:14px}
.btn{min-height:60px;width:100%;border:0;border-radius:16px;background:var(--pri);color:var(--prt);font-weight:800;font-size:19px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.alt{background:var(--sf);color:var(--pri);border:2px solid var(--pri)}

.fields{grid-template-columns:minmax(0,1fr)}
input[type=datetime-local]{min-width:0;font-size:19px;-webkit-appearance:none;appearance:none}
.inp{position:relative}.inp .ic{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-weight:800;font-size:20px}
.fld.s0 input{border-color:var(--ok)}.fld.s0 .ic{color:var(--ok)}
.fld.s1 input{border-color:var(--wn)}.fld.s1 .ic{color:var(--wn)}

.fld.er input{border-color:var(--dg)}
.fld small{font-weight:600;color:var(--mu)}

.sec{display:flex;align-items:center;gap:8px;font-size:20px;font-weight:800;margin:0 0 14px}
.fields{display:grid;gap:14px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{min-height:52px;padding:0 18px;border-radius:99px;border:2px solid var(--bd);background:var(--sf);font:800 17px "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer;color:var(--tx)}

.b0{background:var(--okb);color:var(--ok)}.b1{background:var(--wnb);color:var(--wn)}.b2{background:var(--dgb);color:var(--dg)}
.pond{border-left:8px solid var(--bd)}.pond.p0{border-left-color:var(--ok)}.pond.p1{border-left-color:var(--wn)}.pond.p2{border-left-color:var(--dg)}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.t1{font-size:20px;font-weight:800}.sub{font-size:14px;color:var(--mu);font-weight:600}
.line{display:flex;gap:10px;margin-top:10px;padding:10px 12px;border-radius:14px;font-size:16px;font-weight:600}
.line b{display:block;font-weight:800}.line .g{font-weight:800;font-size:20px;line-height:1.3}
.res p{margin:8px 0 0;font-weight:600}
.dock{position:fixed;left:50%;transform:translateX(-50%);width:100%;max-width:480px;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--sf);box-shadow:0 -8px 22px rgba(20,30,25,.14);padding:10px 16px 12px;z-index:6;border-radius:20px 20px 0 0;display:grid;gap:10px}
.dock .badge{white-space:nowrap;flex:none}
.badge{white-space:nowrap}
.row>.badge{min-width:auto;flex:none}
.dock .st{display:flex;gap:10px;align-items:center;font-size:15px;font-weight:700;line-height:1.3}
.dock .st span:last-child{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding-bottom:env(safe-area-inset-bottom,0px);display:flex;background:var(--sf);border-top:1px solid var(--bd);z-index:7}
nav button{flex:1;min-height:72px;border:0;background:none;color:var(--mu);font:700 13px "Be Vietnam Pro",system-ui,sans-serif;display:grid;place-items:center;align-content:center;gap:3px;cursor:pointer;position:relative}
nav button[aria-current=page]{color:var(--pri)}
nav button[aria-current=page]::before{content:"";position:absolute;top:0;left:25%;right:25%;height:4px;border-radius:0 0 4px 4px;background:var(--pri)}
.toggle{display:flex;gap:14px;align-items:center;cursor:pointer;font-weight:700;font-size:17px}
.toggle input{width:30px;height:30px;min-height:0;flex:none;accent-color:var(--pri)}
.empty{border:2px dashed var(--bd);border-radius:20px;padding:22px;text-align:center;color:var(--mu);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;font-size:16px;z-index:9;max-width:90%}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--pri);color:var(--prt);display:grid;place-items:center;font-size:28px;font-weight:800;flex:none}
.login{max-width:480px;margin:0 auto;padding:calc(40px + env(safe-area-inset-top,0px)) 20px 24px;display:grid;gap:16px;align-content:start;min-height:100vh}
.login .logo{width:72px;height:72px;font-size:38px;border-radius:22px}
.login h1{margin:8px 0 0;font-size:30px}
.pw{display:grid;grid-template-columns:1fr auto;gap:8px}
details.card summary{list-style:none;cursor:pointer}details.card summary::-webkit-details-marker{display:none}
.gh{font-weight:800;font-size:15px;color:var(--pri);margin-top:14px}
.crit{padding:10px 0;border-top:1px solid var(--bd)}
.ct{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cl{font-size:15px;color:var(--mu);font-weight:700}
.cv{font-size:21px;font-weight:800}.cv small{font-size:14px;color:var(--mu);font-weight:600}
.b3{background:var(--sf2);color:var(--mu)}
nav button{font-size:12px;white-space:nowrap;min-width:0;padding:0 2px}
</style>

<script>
function evaluateEntry(f, cfg) {
  var INF = Infinity, LABEL = ['AN TOÀN', 'CHÚ Ý', 'NGUY HIỂM'];
  function num(s) { if (s == null || String(s).trim() === '') return null; return /^\s*-?\d+([.,]\d+)?\s*$/.test(String(s)) ? parseFloat(String(s).replace(',', '.')) : NaN; }
  function band(v, r) {
    var a = r[0] == null ? -INF : r[0], b = r[1] == null ? -INF : r[1], c = r[2] == null ? INF : r[2], d = r[3] == null ? INF : r[3];
    return (v < a || v > d) ? 2 : (v < b || v > c) ? 1 : 0;
  }
  var cr = [];
  cfg.specs.forEach(function (sp) {
    var st = -1, shown = [];
    sp.f.forEach(function (k) { var v = num(f[k]); if (v == null || isNaN(v)) return; shown.push(f[k]); st = Math.max(st, band(v, sp.r)); });
    if (st < 0) return;
    cr.push({label: sp.label, value: shown.join(' / '), st: st, tip: [sp.ok, sp.w, sp.d][st]});
  });
  [['mauNuoc', 'Màu nước'], ['ganTuy', 'Gan tụy'], ['ruot', 'Ruột tôm']].forEach(function (p) {
    var o = (cfg.color[p[0]] || []).filter(function (x) { return x[0] === f[p[0]]; })[0];
    if (!o) return;
    cr.push({label: p[1], value: o[0], st: o[1], tip: ['Tiếp tục theo dõi', 'Giảm ăn, bổ sung vitamin, theo dõi 4 giờ', 'Ngừng ăn, kiểm tra kỹ, liên hệ kỹ thuật'][o[1]]});
  });
  var all = cr.reduce(function (m, c) { return Math.max(m, c.st); }, 0);
  var names = function (s) { return cr.filter(function (c) { return c.st === s; }).map(function (c) { return c.label; }).join(', '); };
  var why = !cr.length ? 'Chưa nhập chỉ số nào.' : all == 2 ? 'Có ' + cr.filter(function (c) { return c.st == 2; }).length + ' chỉ số nguy hiểm: ' + names(2) + '. Nguy cơ tôm sốc, bệnh, hao hụt cao.' : all == 1 ? 'Có ' + cr.filter(function (c) { return c.st == 1; }).length + ' chỉ số cần chú ý: ' + names(1) + '. Xử lý sớm để tránh chuyển nguy hiểm.' : 'Mọi chỉ số đã nhập đều trong ngưỡng tối ưu.';
  var act = all == 2 ? 'Làm ngay: tăng tối đa oxy, dừng hoặc cắt giảm thức ăn, xi phông đáy, thay 20–30% nước sạch đã xử lý, đo lại sau 2 giờ, báo kỹ thuật.' : all == 1 ? 'Tăng quạt, giảm 10–20% thức ăn, xi phông nhẹ, bổ sung vi sinh hoặc vitamin, đo lại sau 4 giờ.' : 'Giữ chế độ chăm sóc hiện tại, cho ăn đúng cữ, chạy quạt đều.';
  return {all: all, empty: !cr.length, why: why, act: act, cr: cr};
}


var LABEL=["AN TOÀN","CHÚ Ý","NGUY HIỂM"];
var NUMF=["phSang","phChieu","doSang","doChieu","nhietDo","doMan","kH","nh3","no2","h2s","thucAn","tlTom"];
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k)||"";if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return ""}}
var S={tok:ls("sat4_tok"),user:null,ponds:[],cfg:null,logs:[],bad:0,tab:"canh",form:null,filter:"all",last:null,toast:"",busy:false,msg:"",login:{u:"",p:""},pw:{o:"",n:"",n2:""},reqId:null};
var API_URL="https://script.google.com/macros/s/AKfycbwaxOU7QPs4fzQoo8ZQqa0nKLvPhidoUeeCfm3Mn__VSMVzdbfF2ejoN_fQkUz65uFs4g/exec"; // dán link triển khai Apps Script (đuôi /exec) vào đây
function rpc(fn){var a=[].slice.call(arguments,1);return fetch(API_URL,{method:"POST",body:JSON.stringify({fn:fn,args:a})}).then(function(r){return r.json()}).then(function(j){if(!j.ok)throw new Error(j.error);return j.data})}
function emsg(e){if(e instanceof TypeError)return "Không kết nối được máy chủ. Kiểm tra mạng rồi thử lại.";return String(e&&e.message||e).replace(/^(Error|Exception):\s*/,"")}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function num(s){if(s==null||String(s).trim()==="")return null;return /^\s*-?\d+([.,]\d+)?\s*$/.test(String(s))?1:NaN}
function nowLocal(){var d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,16)}
function blank(ao){var o={ao:ao||"",ngayGio:nowLocal(),mauNuoc:"Nâu trà",ganTuy:"Nâu đen rõ nét",ruot:"Đầy, rõ nét",hanhDong:"",ok:false};NUMF.forEach(function(k){o[k]=""});return o}
function inputPonds(){return S.ponds.filter(function(p){return p.on}).map(function(p){return p.id})}
function errors(){var e={};NUMF.forEach(function(k){if(isNaN(num(S.form[k])))e[k]="Nhập số, ví dụ 7.8"});return e}
function noA(s){return String(s==null?"":s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/Đ/g,"D").toLowerCase().trim()}
function normF(f){var g=Object.assign({},f);["mauNuoc","ganTuy","ruot"].forEach(function(k){var o=S.cfg.color[k].filter(function(x){return noA(x[0])===noA(g[k])})[0];if(o)g[k]=o[0]});return g}
function evOf(e){
 var ev=evaluateEntry(normF(e.f),S.cfg);
 if(e.kl!=null){if(e.kl>ev.all&&!ev.empty)ev.why="Kết luận trong sổ: "+LABEL[e.kl]+" (có thể do màu nước, gan tụy hoặc ruột). "+ev.why;ev.all=e.kl;ev.empty=false}
 if(e.act)ev.act=e.act;return ev;
}
function toast(t){S.toast=t;draw();setTimeout(function(){S.toast="";draw()},2400)}
function toLogin(m){S.tok="";ls("sat4_tok",null);S.user=null;S.msg=m||"";draw()}
function fail(e){if(emsg(e)==="AUTH"){toLogin("Phiên đã hết hạn, hãy đăng nhập lại.");return}S.busy=false;toast(emsg(e))}

async function load(){
 S.busy=true;draw();
 try{var r=await rpc("api_load",S.tok);S.user=r.user;S.ponds=r.ponds;S.cfg=r.cfg;S.logs=r.logs;S.bad=r.bad;var al=tabsFor();if(!al.some(function(t){return t[0]===S.tab}))S.tab=al[0][0];
  if(!S.form||inputPonds().indexOf(S.form.ao)<0)S.form=blank(inputPonds()[0]);S.busy=false;S.msg="";draw()}
 catch(e){fail(e)}
}
async function doLogin(){
 if(S.busy)return;S.busy=true;S.msg="";draw();
 try{var r=await rpc("api_login",S.login.u,S.login.p);S.tok=r.token;ls("sat4_tok",S.tok);S.login={u:"",p:""};await load()}
 catch(e){S.busy=false;S.msg=emsg(e);S.login.p="";draw()}
}
async function doSave(){
 if(S.busy||!S.user||S.user.ro||Object.keys(errors()).length)return;
 S.busy=true;draw();if(!S.reqId)S.reqId=Date.now()+"-"+Math.random().toString(36).slice(2);
 try{var r=await rpc("api_save",S.tok,S.form,S.reqId);S.reqId=null;S.logs=[r.entry].concat(S.logs);S.last=r.entry;S.busy=false;draw();window.scrollTo(0,0)}
 catch(e){fail(e)}
}
async function doPw(){
 var p=S.pw;if(p.n!==p.n2){toast("Hai mật khẩu mới không giống nhau.");return}
 S.busy=true;draw();
 try{await rpc("api_changePassword",S.tok,p.o,p.n);S.pw={o:"",n:"",n2:""};S.busy=false;draw();toast("Đã đổi mật khẩu.")}
 catch(e){fail(e)}
}
async function doLogout(){var t=S.tok;toLogin("");try{await rpc("api_logout",t)}catch(e){}}

function ico(p,s){return '<svg viewBox="0 0 24 24" width="'+(s||26)+'" height="'+(s||26)+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>'}
var IC={canh:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',nhap:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',lich:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',tk:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',ql:'<circle cx="9" cy="8" r="3.5"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 11a3 3 0 1 0 0-6M22 21a6 6 0 0 0-4-5.6"/>',sync:'<path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
var G=["✓","!","✕"];
function vn(n){return String(n).replace(".",",")}
function ago(t){var h=(Date.now()-new Date(String(t).replace(" ","T")).getTime())/36e5;if(isNaN(h))return"";if(h<1)return"vừa xong";if(h<24)return Math.floor(h)+" giờ trước";return Math.floor(h/24)+" ngày trước"}
function specOf(k){return S.cfg.specs.filter(function(s){return s.f.indexOf(k)>-1})[0]}
function hintOf(sp){var lo=sp.r[1],hi=sp.r[2];return lo!=null&&hi!=null?vn(lo)+" – "+vn(hi):lo!=null?"trên "+vn(lo):hi!=null?"dưới "+vn(hi):""}
function stOf(sp,v){var r=sp.r,a=r[0]==null?-Infinity:r[0],b=r[1]==null?-Infinity:r[1],c=r[2]==null?Infinity:r[2],d=r[3]==null?Infinity:r[3];return(v<a||v>d)?2:(v<b||v>c)?1:0}
function badge(st,t){return '<span class="badge b'+st+'">'+G[st]+' '+(t||LABEL[st])+'</span>'}
function field(k,label,unit,ph){
 var er=errors()[k],sp=specOf(k),v=S.form[k],st=null;
 if(sp&&num(v)===1)st=stOf(sp,parseFloat(String(v).replace(",",".")));
 return '<div class="fld '+(er?"er":st!=null?"s"+st:"")+'"><label for="'+k+'">'+label+(unit?' <small>'+unit+'</small>':"")+'</label><div class="inp"><input type="text" inputmode="decimal" id="'+k+'" data-k="'+k+'" value="'+esc(v)+'" placeholder="'+ph+'" autocomplete="off"><span class="ic" aria-hidden="true">'+(st!=null?G[st]:"")+'</span></div>'+(er?'<div class="msg">'+er+'</div>':sp?'<div class="hint">Mức tốt: '+hintOf(sp)+'</div>':"")+'</div>';
}
function opts(list,cur){return list.map(function(x){var v=x[0]||x;return '<option'+(v===cur?" selected":"")+'>'+esc(v)+'</option>'}).join("")}
function detailHtml(ev){
 var bad=ev.cr.filter(function(c){return c.st>0}).sort(function(a,b){return b.st-a.st}),ok=ev.cr.filter(function(c){return c.st===0});
 return bad.map(function(c){return '<div class="line b'+c.st+'"><span class="g">'+G[c.st]+'</span><div><b>'+esc(c.label)+': '+esc(c.value)+'</b>'+esc(c.tip)+'</div></div>'}).join("")+(ok.length?'<div class="hint" style="margin-top:12px">'+G[0]+' Tốt: '+ok.map(function(c){return esc(c.label)+' '+esc(c.value)}).join(", ")+'</div>':"");
}
function resultHtml(ev,title){
 var st=ev.empty?0:ev.all;
 return '<div class="card res"><div class="sub">'+title+'</div><div style="margin-top:6px">'+(ev.empty?'<span class="badge b1">Chưa có số liệu</span>':badge(st))+'</div><p>'+esc(ev.why)+'</p>'+(ev.empty?"":'<div class="line b'+st+'"><span class="g">➜</span><div><b>Việc cần làm</b>'+esc(ev.act)+'</div></div>')+'</div>';
}
function viewLogin(){

async function loadUsers(){try{S.users=await rpc("api_users",S.tok);draw()}catch(e){fail(e)}}

function viewQl(){
 var h="";
 if(S.edit){var e=S.edit,isNew=!e.id;
  return '<div class="card"><div class="sec">'+(isNew?"Thêm người dùng":"Sửa người dùng")+'</div><div class="fields"><div><label for="e1">Họ tên</label><input type="text" id="e1" data-e="name" value="'+esc(e.name)+'"></div><div><label for="e2">Số điện thoại</label><input type="text" inputmode="tel" id="e2" data-e="phone" value="'+esc(e.phone)+'"></div><div><label for="e3">Tên đăng nhập</label><input type="text" id="e3" data-e="uname" value="'+esc(e.uname)+'" autocapitalize="none" spellcheck="false"'+(isNew?"":" disabled")+'></div><div><label for="e4">Vai trò</label><select id="e4" data-e="role" style="font-size:19px">'+ROLES.map(function(r){return '<option value="'+r[0]+'"'+(e.role===r[0]?" selected":"")+'>'+r[1]+'</option>'}).join("")+'</select></div>'+(e.role==="Chu ao"?'<div class="hint">Chủ ao thấy và quản lý tất cả các ao.</div>':'<div><label>Ao phụ trách</label><div class="chips">'+S.ponds.map(function(p){return '<button type="button" class="pill" data-a="upond" data-id="'+esc(p.id)+'" aria-pressed="'+(e.ponds.indexOf(p.id)>-1)+'">'+esc(p.id)+'</button>'}).join("")+'</div></div>')+'<div><label for="e5">'+(isNew?"Mật khẩu tạm (ít nhất 6 ký tự)":"Mật khẩu mới (bỏ trống nếu không đổi)")+'</label><input type="text" id="e5" data-e="password" value="'+esc(e.password)+'" autocomplete="off"></div><button class="btn" data-a="usave"'+(S.busy?" disabled":"")+'>Lưu</button><button class="btn alt" data-a="ucancel">Hủy</button></div></div>';}
 h+='<button class="btn" data-a="unew">'+ico(IC.plus,24)+' Thêm người dùng</button>';
 if(!S.users)h+='<div class="empty">Đang tải danh sách…</div>';
 (S.users||[]).forEach(function(u){h+='<div class="card"><div class="row"><div><div class="t1">'+esc(u.name)+'</div><div class="sub">@'+esc(u.uname)+' · '+esc(roleLabel(u.role))+'</div></div><button class="btn alt sm" data-a="uedit" data-id="'+esc(u.id)+'">Sửa</button></div><div class="hint" style="margin-top:8px">Ao: '+esc(u.pondsTxt||"chưa có")+'</div></div>'});
 h+='<div class="card"><div class="sec">Các ao</div>'+S.ponds.map(function(p){return '<div class="row" style="align-items:center;padding:10px 0;border-top:1px solid var(--bd)"><div><b>'+esc(p.id)+'</b> <span class="sub">'+esc(p.name)+'</span><div class="sub">'+(p.on?"Đang nuôi":"Ao lắng, không nhập")+'</div></div><button class="btn alt sm" data-a="pondon" data-id="'+esc(p.id)+'" data-on="'+(p.on?0:1)+'">'+(p.on?"Chuyển ao lắng":"Bật nuôi")+'</button></div>'}).join("")+'</div>';

function draw(){
 var keep=document.activeElement&&document.activeElement.id,pos=document.activeElement&&document.activeElement.selectionStart,sy=window.scrollY,app=document.getElementById("app");
 if(!S.tok||!S.user){app.innerHTML=(S.tok&&S.busy)?'<div class="login"><div class="logo">🦐</div><h1>Sổ ao tôm</h1><div class="sub" style="font-size:16px">Đang tải dữ liệu…</div></div>':viewLogin();restore(keep,pos,sy);return}

 restore(keep,pos,sy);

function restore(keep,pos,sy){if(keep){var el=document.getElementById(keep);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}window.scrollTo(0,sy)}
document.addEventListener("input",function(ev){
 var d=ev.target.dataset||{};
 if(d.l){S.login[d.l]=ev.target.value;return}
 if(d.c){S.pw[d.c]=ev.target.value;return}
 if(d.e){S.edit[d.e]=ev.target.value;return}
 if(!d.k||d.k==="filter")return;
 S.form[d.k]=ev.target.type==="checkbox"?ev.target.checked:ev.target.value;S.reqId=null;draw();
});
document.addEventListener("change",function(ev){var d=ev.target.dataset||{};if(d.k==="filter"){S.filter=ev.target.value;draw()}if(d.e==="role"){S.edit.role=ev.target.value;draw()}});
document.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&ev.target.dataset&&ev.target.dataset.l)doLogin()});
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-tab],[data-a]");if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;S.edit=null;draw();window.scrollTo(0,0);if(S.tab==="ql")loadUsers();return}
 var a=t.dataset.a;
 if(a==="login")doLogin();else if(a==="save")doSave();else if(a==="pw")doPw();else if(a==="logout")doLogout();
 else if(a==="reload")load();
 else if(a==="again"){S.form=blank(inputPonds()[0]);S.last=null;draw()}
 else if(a==="showpw"){S.showPw=!S.showPw;draw()}
 else if(a==="go"){S.tab=t.dataset.go;draw();window.scrollTo(0,0)}
 else if(a==="fpond"){S.filter=t.dataset.id;draw()}
 else if(a==="unew"){S.edit={id:"",name:"",phone:"",uname:"",role:"Nguoi nuoi",ponds:[],password:""};draw();window.scrollTo(0,0)}
 else if(a==="uedit"){var u=(S.users||[]).filter(function(x){return x.id===t.dataset.id})[0];if(u){S.edit=editOf(u);draw();window.scrollTo(0,0)}}
 else if(a==="ucancel"){S.edit=null;draw()}
 else if(a==="usave")saveUser();
 else if(a==="upond"){var i=S.edit.ponds.indexOf(t.dataset.id);if(i>-1)S.edit.ponds.splice(i,1);else S.edit.ponds.push(t.dataset.id);draw()}
 else if(a==="pondon")setPond(t.dataset.id,t.dataset.on==="1")
 else if(a==="pond"){S.form.ao=t.dataset.id;S.reqId=null;S.last=null;S.tab="nhap";draw();window.scrollTo(0,0)}
});

else if(S.tok){load()}else{draw()}
</script>
